  <style>
    /* ── Variables ─────────────────────────────────── */
    :root {
      --bg:          #fdf8f6;
      --surface:     #ffffff;
      --primary:     #e8897a;
      --primary-lt:  #f9e8e4;
      --primary-dk:  #c9604f;
      --blue:        #7ab3d4;

      --green:       #7dc9a0;

    /* ── Reset ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

    #app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; }

    /* ── Pages ─────────────────────────────────────── */
    .page { display: flex; flex-direction: column; height: 100%; }
    .hidden { display: none !important; }

    /* ── Boutons ───────────────────────────────────── */
    button { cursor: pointer; border: none; font-family: inherit; font-size: 1rem; transition: opacity .15s, transform .1s; background: none; }

    button:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; padding: 14px 24px; border-radius: 50px; font-weight: 600; font-size: 1rem; width: 100%; }

    /* ── Inputs ────────────────────────────────────── */
    input, select {
      font-family: inherit; font-size: 1rem; color: var(--text);

      border-radius: var(--radius-sm); padding: 12px 14px; width: 100%;
      outline: none; transition: border-color .2s;
    }
    input:focus, select:focus { border-color: var(--primary); }
    label { display: block; font-size: .82rem; font-weight: 600; color: var(--text-lt); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
    .field { margin-bottom: 16px; }

    /* ── Toggle group ──────────────────────────────── */

    .tgl-btn {
      flex: 1; min-width: 80px; padding: 10px 8px; border-radius: var(--radius-sm);

      font-size: .88rem; font-weight: 500; color: var(--text-lt); text-align: center; cursor: pointer;
    }
    .tgl-btn.active { background: var(--primary-lt); border-color: var(--primary); color: var(--primary); font-weight: 600; }

    /* ── Login ─────────────────────────────────────── */

    #login-page .emoji { font-size: 80px; margin-bottom: 8px; }
    #login-page h1 { font-size: 1.5rem; text-align: center; }
    #login-page p.sub { color: var(--text-lt); font-size: .95rem; text-align: center; line-height: 1.5; margin-bottom: 8px; }
    #login-page form { width: 100%; max-width: 320px; }
    #login-code { text-align: center; font-size: 1.2rem; letter-spacing: .1em; font-weight: 600; }
    #login-hint { font-size: .8rem; color: var(--text-lt); text-align: center; max-width: 280px; line-height: 1.5; margin-top: 8px; }
    .err-msg { color: #e05555; font-size: .85rem; margin-top: 6px; }

    /* ── Header ────────────────────────────────────── */
    header { padding: 16px 20px 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .header-row { display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.3rem; }
    header .date { font-size: .78rem; color: var(--text-lt); margin-top: 2px; text-transform: capitalize; }
    .code-badge {
      background: var(--primary-lt); color: var(--primary);
      padding: 6px 12px; border-radius: 20px; font-size: .78rem; font-weight: 600; cursor: pointer;
    }
    #logout-box {

    /* ── Tabs ──────────────────────────────────────── */
    .tabs { display: flex; padding: 12px 20px 0; gap: 8px; background: var(--surface); flex-shrink: 0; }
    .tab-btn { padding: 8px 18px; border-radius: 20px; font-size: .9rem; font-weight: 600; background: var(--primary-lt); color: var(--primary); }
    .tab-btn.active { background: var(--primary); color: #fff; }

    /* ── Main scrollable ───────────────────────────── */
    main { flex: 1; overflow: auto; padding: 16px 20px; }

    /* ── Stats ─────────────────────────────────────── */
    .stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 16px; }

    .detail-bar { background: var(--blue-lt); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; font-size: .85rem; color: var(--text-lt); }

    /* ── Empty state ───────────────────────────────── */

    /* ── Entry cards ───────────────────────────────── */
    .entry-card { display: flex; align-items: flex-start; gap: 12px; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
    .entry-card .eic { font-size: 22px; line-height: 1; margin-top: 1px; }

    .entry-card .esub { font-size: .82rem; color: var(--text-lt); margin-top: 2px; }
    .entry-card .enote { font-size: .8rem; color: var(--text-lt); font-style: italic; margin-top: 3px; }

    /* ── Modal ─────────────────────────────────────── */
    #modal-overlay {
      position: fixed; inset: 0; background: rgba(60,30,20,.35);
      z-index: 100; display: flex; align-items: flex-end; justify-content: center;

      width: 100%; max-width: 480px; background: var(--surface);

    .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; text-align: center; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    /* ── Grid 2 col ────────────────────────────────── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* ── Scrollbar ─────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>

<script>
// ═══════════════════════════════════════════════════
//  INITIALISATION FIREBASE
// ═══════════════════════════════════════════════════
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

// ═══════════════════════════════════════════════════
//  ÉTAT DE L'APP
// ═══════════════════════════════════════════════════
let familyCode      = localStorage.getItem('baby_family_code') || null;
let currentTab      = 'today';
let feedingType     = 'allaitement';
let feedingSide     = 'gauche';
let diaperType      = 'pipi';
let todayListener   = null;
let historyListener = null;

// ═══════════════════════════════════════════════════
//  DÉMARRAGE
// ═══════════════════════════════════════════════════
function init() {
  if (familyCode) {
    showHome();
  } else {
    show('login-page');
    hide('home-page');
  }
}

// ── Login ─────────────────────────────────────────
document.getElementById('login-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const code = document.getElementById('login-code').value.trim().toUpperCase();
  if (code.length < 3) {
    showErr('login-err', 'Le code doit faire au moins 3 caractères.');
    return;
  }
  familyCode = code;
  localStorage.setItem('baby_family_code', code);
  showHome();
});

function showHome() {
  hide('login-page');
  show('home-page');
  document.getElementById('code-badge-btn').textContent = '#' + familyCode;
  document.getElementById('today-label').textContent = new Date().toLocaleDateString('fr-FR', {
    weekday: 'long', day: 'numeric', month: 'long'
  });
  startListeners();
}

function logout() {
  if (todayListener)   { todayListener();   todayListener   = null; }
  if (historyListener) { historyListener(); historyListener = null; }
  localStorage.removeItem('baby_family_code');
  familyCode = null;
  hide('home-page');
  show('login-page');
  hide('logout-box');
  document.getElementById('login-code').value = '';
}

function toggleLogout() {
  document.getElementById('logout-box').classList.toggle('hidden');
}

// ═══════════════════════════════════════════════════
//  FIRESTORE — LISTENERS TEMPS RÉEL
// ═══════════════════════════════════════════════════
function startListeners() {
  // Aujourd'hui
  const startOfDay = new Date();
  startOfDay.setHours(0, 0, 0, 0);

  todayListener = db
    .collection('families').doc(familyCode).collection('entries')
    .where('timestamp', '>=', firebase.firestore.Timestamp.fromDate(startOfDay))
    .orderBy('timestamp', 'desc')
    .onSnapshot(snap => {
      const entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderToday(entries);
    }, err => console.error('Firestore today:', err));
}

function startHistoryListener() {
  if (historyListener) return;
  const since = new Date();
  since.setDate(since.getDate() - 30);
  since.setHours(0, 0, 0, 0);

  historyListener = db
    .collection('families').doc(familyCode).collection('entries')
    .where('timestamp', '>=', firebase.firestore.Timestamp.fromDate(since))
    .orderBy('timestamp', 'desc')
    .onSnapshot(snap => {
      const entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderHistory(entries);
    }, err => console.error('Firestore history:', err));
}

// ═══════════════════════════════════════════════════
//  RENDU — AUJOURD'HUI
// ═══════════════════════════════════════════════════
function renderToday(entries) {
  const feedings = entries.filter(e => e.type === 'feeding');
  const diapers  = entries.filter(e => e.type === 'diaper');
  const last     = feedings[0];

  document.getElementById('stat-feedings').textContent = feedings.length;
  document.getElementById('stat-diapers').textContent  = diapers.length;
  document.getElementById('stat-last').textContent = last
    ? last.timestamp.toDate().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
    : '–';

  const totalMl  = feedings.filter(e => e.feedingType === 'biberon').reduce((s, e) => s + (e.quantity || 0), 0);
  const totalMin = feedings.filter(e => e.feedingType === 'allaitement').reduce((s, e) => s + (e.duration || 0), 0);
  const bar = document.getElementById('detail-bar');
  if (totalMl > 0 || totalMin > 0) {
    bar.classList.remove('hidden');
    bar.innerHTML = (totalMl  > 0 ? '🍼 ' + totalMl  + ' ml biberons&nbsp;&nbsp;' : '') +
                    (totalMin > 0 ? '🤱 ' + totalMin + ' min sein' : '');
  } else {
    bar.classList.add('hidden');
  }

  const container = document.getElementById('timeline-today');
  if (entries.length === 0) {
    container.innerHTML = '<div class="empty"><div class="ic">☀️</div><p>Aucune entrée aujourd\'hui.</p><small>Utilise les boutons ci-dessous !</small></div>';
  } else {
    container.innerHTML = entries.map(entryHTML).join('');
  }
}

// ═══════════════════════════════════════════════════
//  RENDU — HISTORIQUE
// ═══════════════════════════════════════════════════
function renderHistory(entries) {
  const container = document.getElementById('timeline-history');
  if (entries.length === 0) {
    container.innerHTML = '<div class="empty"><p>Aucune donnée sur les 30 derniers jours.</p></div>';
    return;
  }
  // Grouper par jour
  const groups = {};
  entries.forEach(e => {
    if (!e.timestamp) return;
    const d = e.timestamp.toDate().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    if (!groups[d]) groups[d] = [];
    groups[d].push(e);
  });
  container.innerHTML = Object.entries(groups).map(([day, list]) =>
    `<div class="day-group">
      <p class="day-header">${day} · ${list.length} entrée${list.length > 1 ? 's' : ''}</p>
      ${list.map(entryHTML).join('')}
    </div>`
  ).join('');
}

// ═══════════════════════════════════════════════════
//  HTML D'UNE ENTRÉE
// ═══════════════════════════════════════════════════
function entryHTML(e) {
  const time = e.timestamp
    ? e.timestamp.toDate().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
    : '--:--';

  if (e.type === 'feeding') {
    const isBib = e.feedingType === 'biberon';
    const sides = { gauche: '← Gauche', droit: 'Droite →', 'les-deux': '↔ Les deux' };
    const title = isBib ? `Biberon — ${e.quantity} ml` : `Allaitement — ${sides[e.side] || e.side}`;
    const sub   = (!isBib && e.duration) ? `⏱ ${e.duration} min` : '';
    return card('var(--blue-lt)', isBib ? '🍼' : '🤱', title, sub, e.notes || '', time);
  }
  if (e.type === 'diaper') {
    const lbl = { pipi: 'Pipi', caca: 'Caca', mixte: 'Mixte' };
    const ic  = { pipi: '💧', caca: '💩', mixte: '🔀' };
    return card('var(--green-lt)', ic[e.diaperType] || '🩲', 'Couche — ' + (lbl[e.diaperType] || e.diaperType), '', e.notes || '', time);
  }
  if (e.type === 'weight') {
    const date = e.timestamp
      ? e.timestamp.toDate().toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' })
      : '--';
    const sub = [e.height ? e.height + ' cm' : '', e.headCircumference ? 'PC ' + e.headCircumference + ' cm' : ''].filter(Boolean).join(' · ');
    return card('var(--purple-lt)', '⚖️', 'Mesures — ' + (e.weight ? (e.weight / 1000).toFixed(3) + ' kg' : '–'), sub, e.notes || '', date);
  }
  return '';
}

function card(bg, ic, title, sub, note, time) {
  return `<div class="entry-card" style="background:${bg}">
    <span class="eic">${ic}</span>
    <div class="ebody">
      <p class="etitle">${title}</p>
      ${sub  ? `<p class="esub">${sub}</p>`  : ''}
      ${note ? `<p class="enote">${note}</p>` : ''}
    </div>
    <span class="etime">${time}</span>
  </div>`;
}

// ═══════════════════════════════════════════════════
//  NAVIGATION TABS
// ═══════════════════════════════════════════════════
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === 'today') || (i === 1 && tab === 'history'));
  });
  document.getElementById('tab-today').classList.toggle('hidden', tab !== 'today');
  document.getElementById('tab-history').classList.toggle('hidden', tab !== 'history');
  if (tab === 'history') startHistoryListener();
}

// ═══════════════════════════════════════════════════
//  MODALES
// ═══════════════════════════════════════════════════
function openModal(type) {
  // Réinitialiser et pré-remplir l'heure
  const now = localDatetimeValue(new Date());

  hide('modal-feeding'); hide('modal-diaper'); hide('modal-weight');
  show('modal-' + type);
  show('modal-overlay');
  document.body.style.overflow = 'hidden';

  if (type === 'feeding') {
    document.getElementById('f-datetime').value = now;
    document.getElementById('f-duration').value = '';
    document.getElementById('f-quantity').value = '';
    document.getElementById('f-notes').value    = '';
    hide('f-err');
    setFeedingType('allaitement');
    setSide('gauche');
  }
  if (type === 'diaper') {
    document.getElementById('d-datetime').value = now;
    document.getElementById('d-notes').value    = '';
    hide('d-err');
    setDiaperType('pipi');
  }
  if (type === 'weight') {
    document.getElementById('w-date').value   = localDateValue(new Date());
    document.getElementById('w-weight').value = '';
    document.getElementById('w-height').value = '';
    document.getElementById('w-head').value   = '';
    document.getElementById('w-notes').value  = '';
    hide('w-err');
  }
}

function closeModal() {
  hide('modal-overlay');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

// ── Tétée ─────────────────────────────────────────
function setFeedingType(type) {
  feedingType = type;
  document.getElementById('tgl-allait').classList.toggle('active', type === 'allaitement');
  document.getElementById('tgl-biberon').classList.toggle('active', type === 'biberon');
  document.getElementById('allait-fields').classList.toggle('hidden', type !== 'allaitement');
  document.getElementById('biberon-fields').classList.toggle('hidden', type !== 'biberon');
}

function setSide(side) {
  feedingSide = side;
  ['gauche','droit','lesdeux'].forEach(s => {
    document.getElementById('tgl-' + s).classList.remove('active');
  });
  const map = { gauche: 'gauche', droit: 'droit', 'les-deux': 'lesdeux' };
  document.getElementById('tgl-' + map[side]).classList.add('active');
}

async function submitFeeding() {
  hide('f-err');
  if (feedingType === 'allaitement' && !document.getElementById('f-duration').value) {
    return showErr('f-err', 'Indique la durée de la tétée.');
  }
  if (feedingType === 'biberon' && !document.getElementById('f-quantity').value) {
    return showErr('f-err', 'Indique la quantité en ml.');
  }
  setLoading('f-submit', true);
  try {
    const data = {
      type: 'feeding', feedingType,
      timestamp: firebase.firestore.Timestamp.fromDate(new Date(document.getElementById('f-datetime').value)),
      notes: document.getElementById('f-notes').value.trim(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    };
    if (feedingType === 'allaitement') {
      data.side     = feedingSide;
      data.duration = Number(document.getElementById('f-duration').value);
    } else {
      data.quantity = Number(document.getElementById('f-quantity').value);
    }
    await db.collection('families').doc(familyCode).collection('entries').add(data);
    closeModal();
  } catch (err) { showErr('f-err', 'Erreur réseau. Vérifie ta connexion.'); console.error(err); }
  setLoading('f-submit', false);
}

// ── Couche ─────────────────────────────────────────
function setDiaperType(type) {
  diaperType = type;
  ['pipi','caca','mixte'].forEach(t => {
    document.getElementById('tgl-' + t).classList.toggle('active', t === type);
  });
}

async function submitDiaper() {
  hide('d-err');
  setLoading('d-submit', true);
  try {
    await db.collection('families').doc(familyCode).collection('entries').add({
      type: 'diaper', diaperType,
      timestamp: firebase.firestore.Timestamp.fromDate(new Date(document.getElementById('d-datetime').value)),
      notes: document.getElementById('d-notes').value.trim(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    closeModal();
  } catch (err) { showErr('d-err', 'Erreur réseau. Vérifie ta connexion.'); console.error(err); }
  setLoading('d-submit', false);
}

// ── Mesures ────────────────────────────────────────
async function submitWeight() {
  hide('w-err');
  if (!document.getElementById('w-weight').value) {
    return showErr('w-err', 'Le poids est requis.');
  }
  setLoading('w-submit', true);
  try {
    const d = document.getElementById('w-date').value;
    const data = {
      type: 'weight',
      timestamp: firebase.firestore.Timestamp.fromDate(new Date(d + 'T12:00:00')),
      notes: document.getElementById('w-notes').value.trim(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      weight: Number(document.getElementById('w-weight').value),
    };
    const h = document.getElementById('w-height').value;
    const p = document.getElementById('w-head').value;
    if (h) data.height            = Number(h);
    if (p) data.headCircumference = Number(p);
    await db.collection('families').doc(familyCode).collection('entries').add(data);
    closeModal();
  } catch (err) { showErr('w-err', 'Erreur réseau. Vérifie ta connexion.'); console.error(err); }
  setLoading('w-submit', false);
}

// ═══════════════════════════════════════════════════
//  UTILITAIRES
// ═══════════════════════════════════════════════════
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }
function showErr(id, msg) { const el = document.getElementById(id); el.textContent = msg; el.classList.remove('hidden'); }
function setLoading(id, on) {
  const btn = document.getElementById(id);
  btn.disabled = on;
  btn.textContent = on ? 'Enregistrement...' : 'Enregistrer ✓';
}
function localDatetimeValue(date) {
  const p = n => String(n).padStart(2,'0');
  return `${date.getFullYear()}-${p(date.getMonth()+1)}-${p(date.getDate())}T${p(date.getHours())}:${p(date.getMinutes())}`;
}
function localDateValue(date) {
  const p = n => String(n).padStart(2,'0');
  return `${date.getFullYear()}-${p(date.getMonth()+1)}-${p(date.getDate())}`;
}

// ═══════════════════════════════════════════════════
//  LANCEMENT
// ═══════════════════════════════════════════════════
init();
</script>
